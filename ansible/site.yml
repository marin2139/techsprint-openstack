---
# ================================================================
# TechSprint — Ansible site playbook
# Run after Terraform has provisioned all infrastructure.
#
# Usage:
#   cd ansible/
#   terraform -chdir=../terraform output -raw ansible_inventory > inventory.ini
#   ansible-playbook site.yml
# ================================================================

- name: Common configuration (all hosts)
  hosts: all
  become: true
  roles:
    - common

- name: Configure bastion host
  hosts: bastion
  become: true
  roles:
    - bastion

- name: Configure lead hosts
  hosts: lead
  become: true
  roles:
    - lead

- name: Configure Moodle hosts
  hosts: moodle
  become: true
  roles:
    - moodle
